[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-engineering-toolkit"
version = "0.1.0"
description = "Reusable feature-engineering transformers, an ML workflow, and Markdown reporting for reproducible data-science projects."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Muhtasim-Munif-Fahim"}]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
feature-engineering-toolkit = "feature_engineering_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
